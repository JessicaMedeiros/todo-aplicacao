<div class="page">

  <!-- Header -->
  <header class="page-header">
    <h1 class="page-title">
      <mat-icon class="title-icon">check_circle_outline</mat-icon>
      Minhas Tarefas
    </h1>
    <span class="task-count" *ngIf="tarefas.length">
      {{ tarefas.length }} tarefa{{ tarefas.length !== 1 ? 's' : '' }}
    </span>
  </header>

  <!-- Formulário de nova tarefa -->
  <div class="form-card">
    <h2 class="form-title">Nova tarefa</h2>

    <mat-form-field appearance="outline" class="field-full">
      <mat-label>Título</mat-label>
      <input matInput [(ngModel)]="novoTitulo" (keyup.enter)="adicionar()" placeholder="Ex.: Comprar pão">
      <mat-icon matPrefix>title</mat-icon>
    </mat-form-field>

    <div class="field-row">
      <mat-form-field appearance="outline" class="field-priority">
        <mat-label>Prioridade</mat-label>
        <input matInput type="number" min="0" [(ngModel)]="novaPrioridade">
        <mat-icon matPrefix>flag</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="field-obs">
        <mat-label>Observação</mat-label>
        <input matInput [(ngModel)]="novaObs" placeholder="Opcional">
      </mat-form-field>
    </div>

    <button mat-flat-button class="btn-add" (click)="adicionar()">
      <mat-icon>add</mat-icon>
      Adicionar
    </button>
  </div>

  <!-- Lista de tarefas -->
  <div class="task-list">

    <!-- Estado vazio -->
    <div class="empty-state" *ngIf="tarefas.length === 0">
      <mat-icon class="empty-icon">inbox</mat-icon>
      <p>Nenhuma tarefa por aqui ainda.</p>
    </div>

    <div
      class="task-card"
      *ngFor="let tarefa of tarefas"
      [class.task-done]="tarefa.concluida"
      [routerLink]="['/tarefas', tarefa.id]"
    >
      <!-- Prioridade como faixa lateral colorida -->
      <div class="priority-bar" [attr.data-priority]="tarefa.prioridade"></div>

      <div class="task-body">
        <div class="task-top">
          <span class="task-title">{{ tarefa.titulo }}</span>
          <span class="priority-badge" [attr.data-priority]="tarefa.prioridade">
            P{{ tarefa.prioridade }}
          </span>
        </div>
        <p class="task-obs" *ngIf="tarefa.observacao">{{ tarefa.observacao }}</p>
      </div>

      <div class="task-actions" (click)="$event.stopPropagation()">
        <button
          mat-icon-button
          class="btn-check"
          *ngIf="!tarefa.concluida"
          (click)="concluir(tarefa.id, $event)"
          matTooltip="Concluir"
        >
          <mat-icon>check_circle</mat-icon>
        </button>
        <mat-icon class="done-icon" *ngIf="tarefa.concluida">task_alt</mat-icon>
        <button
          mat-icon-button
          class="btn-delete"
          (click)="remover(tarefa.id, $event)"
          matTooltip="Remover"
        >
          <mat-icon>delete_outline</mat-icon>
        </button>
      </div>
    </div>

  </div>
</div>
