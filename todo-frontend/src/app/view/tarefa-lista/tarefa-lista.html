<div class="page">
  <div class="container">

    <header class="header">
      <h1 class="heading">Minhas tarefas</h1>
      <span class="count" *ngIf="tarefas.length">{{ tarefas.length }}</span>
    </header>

    <div class="add-form">
      <div class="add-row">
        <mat-form-field appearance="outline" class="field-title">
          <mat-label>Nova tarefa</mat-label>
          <input matInput [(ngModel)]="novoTitulo" (keyup.enter)="adicionar()" autocomplete="off">
        </mat-form-field>

        <mat-form-field appearance="outline" class="field-prioridade">
          <mat-label>Prioridade</mat-label>
          <mat-select [(ngModel)]="novaPrioridade">
            <mat-option [value]="0">Sem prioridade</mat-option>
            <mat-option [value]="1">Baixa</mat-option>
            <mat-option [value]="2">Média</mat-option>
            <mat-option [value]="3">Alta</mat-option>
          </mat-select>
        </mat-form-field>

        <button mat-flat-button class="btn-add" (click)="adicionar()">
          Adicionar
        </button>
      </div>

      <mat-form-field appearance="outline" class="field-obs">
        <mat-label>Observação (opcional)</mat-label>
        <input matInput [(ngModel)]="novaObs" autocomplete="off">
      </mat-form-field>
    </div>

    <div class="task-list" *ngIf="tarefas.length > 0">
      <div
        class="task-row"
        matRipple
        [matRippleColor]="'rgba(59,91,219,.08)'"
        *ngFor="let tarefa of tarefas"
        [class.done]="tarefa.concluida"
        [attr.data-p]="tarefa.prioridade"
        [routerLink]="['/tarefas', tarefa.id]"
      >
        <div class="task-main">
          <span class="task-title">{{ tarefa.titulo }}</span>
          <span class="task-obs" *ngIf="tarefa.observacao">{{ tarefa.observacao }}</span>
        </div>
        <div class="task-actions" (click)="$event.stopPropagation()">
          <button
            mat-icon-button
            *ngIf="!tarefa.concluida"
            (click)="concluir(tarefa.id, $event)"
            matTooltip="Concluir"
            class="check-btn"
          >
            <mat-icon>check</mat-icon>
          </button>
          <mat-icon class="done-mark" *ngIf="tarefa.concluida">check</mat-icon>
          <button
            mat-icon-button
            (click)="remover(tarefa.id, $event)"
            matTooltip="Remover"
            class="del-btn"
          >
            <mat-icon>close</mat-icon>
          </button>
        </div>
      </div>
    </div>

    <p class="empty" *ngIf="tarefas.length === 0">
      Nenhuma tarefa. Adicione uma acima.
    </p>

  </div>
</div>
