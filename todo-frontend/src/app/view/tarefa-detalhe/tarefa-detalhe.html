<div class="page" *ngIf="tarefa">
  <div class="container">

    <nav class="nav">
      <button mat-button class="btn-back" (click)="voltar()">
        <mat-icon>arrow_back</mat-icon>
        Voltar
      </button>
      <span class="status-chip" [class.done]="tarefa.concluida">
        {{ tarefa.concluida ? 'Concluída' : 'Pendente' }}
      </span>
    </nav>

    <h1 class="heading">
      Editar tarefa
      <span class="task-id">#{{ tarefa.id }}</span>
    </h1>

    <div class="form">

      <mat-form-field appearance="outline" class="field-full">
        <mat-label>Título</mat-label>
        <input matInput [(ngModel)]="tarefa.titulo">
      </mat-form-field>

      <mat-form-field appearance="outline" class="field-full">
        <mat-label>Prioridade</mat-label>
        <mat-select [(ngModel)]="tarefa.prioridade">
          <mat-option [value]="0">Sem prioridade</mat-option>
          <mat-option [value]="1">Baixa</mat-option>
          <mat-option [value]="2">Média</mat-option>
          <mat-option [value]="3">Alta</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="field-full">
        <mat-label>Observação</mat-label>
        <textarea matInput [(ngModel)]="tarefa.observacao" rows="4"></textarea>
      </mat-form-field>

      <div class="form-actions">
        <button mat-stroked-button class="btn-cancel" (click)="voltar()">Cancelar</button>
        <button mat-flat-button class="btn-save" (click)="salvar()">Salvar</button>
      </div>

    </div>

  </div>
</div>
