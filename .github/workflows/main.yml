name: CI

on: [push]

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: todo-api/requirements.txt

      - name: Instalar dependências
        run: pip install -r todo-api/requirements.txt

      - name: Rodar testes
        run: pytest todo-api/ -v --junitxml=test-results.xml

      - name: Publicar resultado teste a teste
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Resultados dos testes
          path: test-results.xml
          reporter: java-junit
          fail-on-error: true
